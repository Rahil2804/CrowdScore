services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: crowdscore
      POSTGRES_USER: crowdscore
      POSTGRES_PASSWORD: crowdscore_dev
    ports:
      - "5432:5432"
    volumes:
      - crowdscore-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crowdscore -d crowdscore"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  crowdscore-postgres-data:
